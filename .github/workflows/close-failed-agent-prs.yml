name: Close agent PRs with failed CI

# When the "WinEase CI" run of a pull request opened by an agent fails, the pull request is closed
# with an explanatory comment and its branch is deleted. GitHub cannot delete a pull request
# itself; closing it and removing the branch is the closest equivalent, and the pull request can
# be reopened (and the branch restored from the PR page) if the close was unwanted.
#
# Scope (kept narrow on purpose, see docs/dev/github-automation-audit.md for the trust model):
#   - only runs of the "WinEase CI" workflow that concluded "failure" (cancelled/skipped never match),
#   - only pull requests whose head branch lives in this repository (never forks),
#   - only head branches named claude/* (the agent workflows push there); human branches are untouched,
#   - only if the pull request head still is the commit that failed (a newer push is left alone).
# The job never checks out or runs pull request code.
#
# Manual run: Actions -> "Close agent PRs with failed CI" -> Run workflow with a pull request number.

on:
  # zizmor: workflow_run runs with secrets in the default branch context. The job below does not
  # check out or execute anything from the pull request; the branch name only reaches the shell
  # through an environment variable and is matched against a fixed prefix first.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["WinEase CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Close this agent pull request (claude/* branch of this repository) now"
        required: true
        type: string

concurrency:
  group: close-failed-agent-prs
  cancel-in-progress: false

permissions: {}

jobs:
  close:
    name: Close failed agent pull request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # delete the pull request's claude/* branch
      pull-requests: write   # comment on and close the pull request
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
      DISPATCH_PR: ${{ inputs.pr_number }}
    steps:
      - name: Close pull requests and delete their branches
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_PR" ]; then
            numbers="$DISPATCH_PR"
          else
            numbers="$(jq -r '.[]' <<<"$RUN_PRS")"
          fi
          for number in $numbers; do
            [[ "$number" =~ ^[0-9]+$ ]] || { echo "skipping invalid number: $number"; continue; }
            pr="$(gh api "repos/${REPO}/pulls/${number}")"
            state="$(jq -r '.state' <<<"$pr")"
            head_ref="$(jq -r '.head.ref' <<<"$pr")"
            head_sha="$(jq -r '.head.sha' <<<"$pr")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
            if [ "$state" != "open" ]; then echo "#${number}: not open, skipping"; continue; fi
            if [ "$head_repo" != "$REPO" ] || [[ "$head_ref" != claude/* ]]; then
              echo "#${number}: not a claude/* branch of this repository, skipping"; continue
            fi
            if [ -z "$DISPATCH_PR" ] && [ "$head_sha" != "$RUN_SHA" ]; then
              echo "#${number}: head moved on since the failed run, skipping"; continue
            fi
            body="CI failed for this agent pull request, so it is being closed and its branch deleted. ${RUN_URL:+Failed run: ${RUN_URL}}"$'\n\n'"Reopen the pull request (and restore the branch from its page) if this was unwanted."
            gh pr comment "$number" --repo "$REPO" --body "$body"
            gh pr close "$number" --repo "$REPO"
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${head_ref}"
            echo "#${number}: closed, deleted ${head_ref}"
          done

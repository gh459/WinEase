name: debug-ci (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Robust removal - enumeration denied (as in the Pester test)
        continue-on-error: true
        shell: powershell
        run: |
          . .\WinEasehelpers.ps1
          "ErrorActionPreference=$ErrorActionPreference"
          $root = Join-Path ([System.IO.Path]::GetTempPath()) ('WinEase_robust_' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          $tree = Join-Path $root 't_enum'
          $denied = Join-Path $tree 'DeniedSvc'
          [System.IO.Directory]::CreateDirectory($denied) | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $denied 'payload.bin'), 'x')
          & icacls.exe $denied /inheritance:r /deny '*S-1-5-32-544:RX' /C /Q
          "--- ACL after setup"
          icacls.exe $denied
          "--- run helper (verbose)"
          try {
            $ok = Remove-WinEaseTreeRobust -Path $tree -SafetyRoot $root -Verbose 4>&1 | ForEach-Object { "$_" }
            "result: $ok"
          } catch {
            "THREW: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
            $_.ScriptStackTrace
          }
          "tree still exists: $(Test-Path -LiteralPath $tree)"

      - name: Robust removal - same, but under Stop (what Pester 3 may impose)
        continue-on-error: true
        shell: powershell
        run: |
          . .\WinEasehelpers.ps1
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ([System.IO.Path]::GetTempPath()) ('WinEase_robust_' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          $tree = Join-Path $root 't_enum'
          $denied = Join-Path $tree 'DeniedSvc'
          [System.IO.Directory]::CreateDirectory($denied) | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $denied 'payload.bin'), 'x')
          & icacls.exe $denied /inheritance:r /deny '*S-1-5-32-544:RX' /C /Q > $null 2>&1
          try {
            $ok = Remove-WinEaseTreeRobust -Path $tree -SafetyRoot $root
            "result: $ok"
          } catch {
            "THREW: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
            $_.ScriptStackTrace
          }
          "tree still exists: $(Test-Path -LiteralPath $tree)"

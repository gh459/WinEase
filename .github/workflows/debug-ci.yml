name: debug-ci (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Candidate setup for the SYSTEM-only DACL test
        continue-on-error: true
        shell: powershell
        run: |
          . .\WinEasehelpers.ps1
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $root = Join-Path ([System.IO.Path]::GetTempPath()) ('WinEase_robust_' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          $tree = Join-Path $root 't_wim'
          $denied = Join-Path $tree 'WebThreatDefSvc'
          [System.IO.Directory]::CreateDirectory($denied) | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $denied 'payload.bin'), 'x')
          & icacls.exe $denied /inheritance:r > $null 2>&1
          & icacls.exe $denied /grant '*S-1-5-18:F' /C /Q > $null 2>&1
          & icacls.exe $denied /setowner '*S-1-5-18' /C /Q > $null 2>&1
          & icacls.exe $denied /remove:g '*S-1-5-32-544' /C /Q > $null 2>&1
          & icacls.exe $denied /remove:g "*$me" /C /Q > $null 2>&1
          "--- icacls"
          icacls.exe $denied
          "--- Get-Acl"
          try {
            $acl = Get-Acl -LiteralPath $denied
            $n = @($acl.Access | Where-Object { try { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value -eq 'S-1-5-32-544' } catch { $false } }).Count
            "admins ACEs: $n   owner: $($acl.Owner)"
          } catch { "Get-Acl THREW: $($_.Exception.Message)" }
          "--- helper"
          try { "result: $(Remove-WinEaseTreeRobust -Path $tree -SafetyRoot $root)" } catch { "THREW: $($_.Exception.Message)" }
          "tree exists after: $(Test-Path -LiteralPath $tree)"

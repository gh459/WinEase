name: debug-ci (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migration .bak scenario
        continue-on-error: true
        shell: powershell
        run: |
          . .\WinEasehelpers.ps1
          . .\tools\migrator\WinEaseMigration.ps1
          $srcDir = Join-Path $env:TEMP 'migtest_src3'
          $bkDir  = Join-Path $env:TEMP 'migtest_bk3'
          New-Item -ItemType Directory -Force -Path (Join-Path $srcDir 'Documents') | Out-Null
          'hello' | Set-Content (Join-Path $srcDir 'Documents\test.txt')
          $docs = Join-Path $srcDir 'Documents'
          $probe = Get-ChildItem -LiteralPath $docs -Recurse -File
          "srcPath : $docs"
          "FullName: $($probe[0].FullName)"
          $b = Backup-WinEaseUserData -FolderMap @{ Documents = $docs } -BackupRoot $bkDir
          "--- manifest"
          Get-Content (Join-Path $bkDir 'migration-manifest.json') -Raw
          $destFile = Join-Path $env:USERPROFILE 'test.txt'
          'existing' | Set-Content $destFile
          $r = Restore-WinEaseUserData -BackupRoot $bkDir -ConflictPolicy BackupExisting
          "restored=$($r.RestoredFiles) bak exists=$(Test-Path "$destFile.WinEase.bak")"

      - name: Robust-removal ACL scenario
        continue-on-error: true
        shell: powershell
        run: |
          $root = Join-Path ([System.IO.Path]::GetTempPath()) ('WinEase_robust_' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          $denied = Join-Path $root 't_wim\WebThreatDefSvc'
          [System.IO.Directory]::CreateDirectory($denied) | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $denied 'payload.bin'), 'x')
          "--- before"
          icacls.exe $denied
          icacls.exe $denied /inheritance:r
          icacls.exe $denied /grant '*S-1-5-18:F' /C /Q
          icacls.exe $denied /setowner '*S-1-5-18' /C /Q
          "--- after"
          icacls.exe $denied
          "owner: $((Get-Acl -LiteralPath $denied).Owner)"

name: PSScriptAnalyzer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  # release.yml runs the same check on the tagged commit before it publishes anything
  workflow_call:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer
        # The Pester suite runs the analyzer too, but only when the module is installed
        # on the machine. This workflow makes the static check a gate of its own.
        # Only errors fail the build: a new warning of a newer analyzer version must
        # not break the pipeline of a pull request.
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PSRepository -Name 'PSGallery' -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction SilentlyContinue
          }
          if (Get-PSRepository -Name 'PSGallery' -ErrorAction SilentlyContinue) {
            Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          }
          # Pin the analyzer version (review finding O-M1): installing "the newest" made
          # lint results depend on whatever PSGallery served that day and let a new rule
          # set appear without a code change. Bump this version deliberately, in its own
          # pull request, so the rule change is reviewed like a code change.
          $analyzerVersion = '1.22.0'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq $analyzerVersion })) {
            $attempts = 0
            while ($attempts -lt 3) {
              try {
                # -SkipPublisherCheck is kept on purpose: with it removed, a PSGallery
                # publisher-certificate rotation can fail this non-interactive install
                # even for the genuine Microsoft module. The reproducibility control is
                # the pinned -RequiredVersion above, not the publisher check.
                Install-Module PSScriptAnalyzer -RequiredVersion $analyzerVersion -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
                break
              } catch {
                $attempts++
                if ($attempts -ge 3) { throw }
                Start-Sleep -Seconds 5
              }
            }
          }
          # Load exactly the pinned version, so a different preinstalled copy on the
          # runner image is not picked up silently.
          Import-Module PSScriptAnalyzer -RequiredVersion $analyzerVersion -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          foreach ($r in $results) {
            $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Host "::$level file=$($r.ScriptPath),line=$($r.Line)::$($r.RuleName): $($r.Message)"
          }
          if (@($results | Where-Object Severity -eq 'Error').Count -gt 0) { throw 'PSScriptAnalyzer reported errors' }

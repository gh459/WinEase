name: Claude issue agent

# Lets Claude Code work on an issue in two ways:
#   1. Assign the issue to the account named in the CLAUDE_AGENT_ASSIGNEE repository variable
#      (defaults to "claude-agent" when unset).
#   2. Mention @claude in an issue or pull request comment.
# The agent then implements the request, pushes a branch, and opens a draft pull request.

on:
  issues:
    types: [assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-issue-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    name: Run Claude on issue
    # Only run for an issue assigned to the agent account, or for a comment that mentions @claude.
    # The assignee check reads the repository variable so the account can be changed without editing this file.
    if: >-
      (github.event_name == 'issues' &&
        github.event.action == 'assigned' &&
        github.event.assignee.login == (vars.CLAUDE_AGENT_ASSIGNEE || 'claude-agent')) ||
      (github.event_name != 'issues' &&
        contains(github.event.comment.body || github.event.review.body || '', '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Assignment trigger for the issues event. Matches the if: condition above.
          assignee_trigger: ${{ vars.CLAUDE_AGENT_ASSIGNEE || 'claude-agent' }}
          # Tools Claude may use while working on the issue. Changes are delivered as a pull request
          # from a branch, so the default branch is never pushed to directly.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

name: Release

# Publishes a GitHub release for a v* tag. Nothing is published unless every check passed
# on the exact commit the tag points to:
#
#   ci / lint / audit   the regular CI (self-test, Pester, dry-runs), PSScriptAnalyzer and the
#                       workflow security audit, called as reusable workflows (read-only)
#   package             checks that the tag still names the commit under test, builds the ZIP
#                       from that commit, verifies it and writes its SHA-256 (read-only)
#   publish             the only job with write access: re-checks the tag and the checksum,
#                       records a build provenance attestation, creates the release and
#                       verifies the uploaded assets against the checksum
#
# A failed check stops the run before "publish"; the failing job names the check.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  audit:
    name: Workflow audit
    uses: ./.github/workflows/workflow-audit.yml
    permissions:
      contents: read

  package:
    name: Package and verify
    needs: [ci, lint, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asset: ${{ steps.build.outputs.asset }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Identify the commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          head="$(git rev-parse HEAD)"
          echo "Checked out: $head"
          echo "Triggered by: $GITHUB_SHA ($TAG)"
          [ "$head" = "$GITHUB_SHA" ] || { echo "::error title=Commit mismatch::checked out $head, expected $GITHUB_SHA"; exit 1; }
          tagged="$(.github/scripts/resolve-tag-commit.sh "$TAG")"
          [ "$tagged" = "$GITHUB_SHA" ] || { echo "::error title=Tag moved::$TAG now points to $tagged, the checks ran on $GITHUB_SHA"; exit 1; }
          git status --porcelain | grep . && { echo "::error title=Dirty checkout::the working tree is not the plain commit"; exit 1; } || true

      - name: Build the source ZIP
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          asset="WinEase-${TAG}.zip"
          git archive --format=zip --prefix=WinEase/ -o "dist/$asset" "$GITHUB_SHA"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Verify the ZIP
        env:
          ASSET: ${{ steps.build.outputs.asset }}
        run: python3 -I .github/scripts/verify-release-zip.py "dist/$ASSET" "$GITHUB_SHA" WinEase

      - name: Write the SHA-256 checksum
        env:
          ASSET: ${{ steps.build.outputs.asset }}
        working-directory: dist
        run: |
          sha256sum "$ASSET" > "$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          {
            echo "### Release package"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Asset: \`$ASSET\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$ASSET.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # sign the build provenance attestation
      attestations: write   # store the attestation
    steps:
      - name: Fetch the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: dist

      - name: Re-check the checksum and the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ needs.package.outputs.asset }}
        run: |
          (cd dist && sha256sum -c "$ASSET.sha256")
          ls -l dist
          [ "$(find dist -type f | wc -l)" -eq 2 ] || { echo "::error title=Unexpected files::the package holds more than the ZIP and its checksum"; exit 1; }
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          type="$(jq -r .object.type <<<"$ref")"; sha="$(jq -r .object.sha <<<"$ref")"
          if [ "$type" = "tag" ]; then sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"; fi
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error title=Tag moved::$TAG now points to $sha, the package was built from $GITHUB_SHA"; exit 1; }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.package.outputs.asset }}

      - name: Create release
        # zizmor: ignore[superfluous-actions] the existing publishing action is kept (release notes, asset upload)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/${{ needs.package.outputs.asset }}
            dist/${{ needs.package.outputs.asset }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ needs.package.outputs.asset }}
        run: |
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published --pattern "$ASSET" --pattern "$ASSET.sha256"
          cmp dist/"$ASSET.sha256" published/"$ASSET.sha256"
          (cd published && sha256sum -c "$ASSET.sha256")
          echo "Published $ASSET matches the verified package."

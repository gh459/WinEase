name: WinEase CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust physical debloat engine
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build and test the physical debloat engine
        shell: pwsh
        run: |
          cargo test --manifest-path tools/winease-physical-debloat/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }
          cargo build --release --manifest-path tools/winease-physical-debloat/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }

      - name: Lint the physical debloat engine
        # The lints are reported but they do not fail the build: a newer toolchain can
        # add a lint, and a new lint must not break the pipeline of a pull request. The
        # compiler errors still fail the step.
        shell: pwsh
        run: |
          cargo clippy --manifest-path tools/winease-physical-debloat/Cargo.toml --all-targets --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed with exit code $LASTEXITCODE" }

  self-test:
    name: Self-test (AST + unattend schema + presets)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run WinEase self-test
        shell: pwsh
        run: |
          .\WinEasebuilder.ps1 -TestSelf
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed with exit code $LASTEXITCODE" }

  pester:
    name: Pester test suite
    runs-on: windows-latest
    needs: self-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Pester tests
        # The suite is written in Pester 3 syntax ("Should Be" without dashes), which Pester 5
        # rejects, and it is developed on Windows PowerShell 5.1. The runner image also ships
        # Pester 5, so pin 3.4.0 explicitly instead of taking whatever is newest.
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            Install-Module -Name Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $result = Invoke-Pester -Path .\tests\WinEase.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed" }

  dry-run:
    name: Dry-run configuration resolution
    runs-on: windows-latest
    needs: self-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run dry-run (extreme profile)
        shell: pwsh
        run: |
          .\WinEasebuilder.ps1 -DryRun -NonInteractive -Profile extreme
          if ($LASTEXITCODE -ne 0) { throw "Dry-run failed with exit code $LASTEXITCODE" }

name: WinEase CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  # release.yml runs the same checks on the tagged commit before it publishes anything
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-test:
    name: Self-test (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 (the supported runtime), pwsh = PowerShell 7
        shell: [powershell, pwsh]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run WinEase self-test (powershell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          .\WinEasebuilder.ps1 -TestSelf
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed with exit code $LASTEXITCODE" }
      - name: Run WinEase self-test (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          .\WinEasebuilder.ps1 -TestSelf
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed with exit code $LASTEXITCODE" }

  pester:
    name: Pester test suite
    runs-on: windows-latest
    needs: self-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build the built-in plugins
        # The registry snapshot tests need the plugin DLLs (plugins\builtin is gitignored). Without
        # them those tests are skipped and a green run says nothing about the registry phase.
        shell: pwsh
        run: ./tools/build-binaries.ps1 -Component Plugins

      - name: Run Pester tests
        # The suite is written in Pester 3 syntax ("Should Be" without dashes), which Pester 5
        # rejects, and it is developed on Windows PowerShell 5.1. The runner image also ships
        # Pester 5, so pin 3.4.0 explicitly instead of taking whatever is newest.
        # Pester 3.4 does not load on PowerShell 7 (it needs Get-WmiObject), so the suite runs on
        # 5.1 only; the PowerShell 7 coverage comes from the self-test and dry-run matrices.
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            Install-Module -Name Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          # Pester 3.4 discovers every *.Tests.ps1 under .\tests; _TestCommon.ps1 is
          # dot-sourced by the test files and is not a test itself.
          $result = Invoke-Pester -Path .\tests -PassThru -OutputFormat NUnitXml -OutputFile .\pester-results.xml
          # One annotation per failed test: test name, file and the failure message
          foreach ($t in @($result.TestResult | Where-Object { $_.Result -eq 'Failed' })) {
            $msg = ("$($t.FailureMessage)" -replace '\r?\n', ' ')
            Write-Host "::error title=Pester: $($t.Describe)::$($t.Name) - $msg"
          }
          Write-Host "Passed: $($result.PassedCount)  Failed: $($result.FailedCount)  Skipped: $($result.SkippedCount)  Inconclusive: $($result.InconclusiveCount)"
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed" }
          # A silently growing skip count hides tests that no longer run (the plugin-dependent
          # registry tests skip themselves when the DLLs are missing). Raise the limit only on purpose.
          $maxSkipped = 12
          if ($result.SkippedCount -gt $maxSkipped) {
            Write-Host "::error title=Pester skipped tests::$($result.SkippedCount) tests were skipped (limit $maxSkipped)"
            throw "$($result.SkippedCount) Pester tests were skipped; the limit is $maxSkipped"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results
          path: pester-results.xml
          if-no-files-found: warn
          retention-days: 14

  dry-run:
    name: Dry-run ${{ matrix.profile }} (${{ matrix.shell }})
    runs-on: windows-latest
    needs: self-test
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh]
        profile: [extreme, balanced, none, vm]
        include:
          - shell: powershell
            profile: extreme
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run dry-run (powershell)
        if: matrix.shell == 'powershell'
        shell: powershell
        env:
          WINEASE_PROFILE: ${{ matrix.profile }}
        run: |
          .\WinEasebuilder.ps1 -DryRun -NonInteractive -Profile $env:WINEASE_PROFILE
          if ($LASTEXITCODE -ne 0) { throw "Dry-run ($env:WINEASE_PROFILE) failed with exit code $LASTEXITCODE" }
      - name: Run dry-run (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          WINEASE_PROFILE: ${{ matrix.profile }}
        run: |
          .\WinEasebuilder.ps1 -DryRun -NonInteractive -Profile $env:WINEASE_PROFILE
          if ($LASTEXITCODE -ne 0) { throw "Dry-run ($env:WINEASE_PROFILE) failed with exit code $LASTEXITCODE" }

  binaries:
    name: .NET binaries (${{ matrix.arch }})
    # Builds the .NET parts: the WinUI 3 window, WinEase.exe and the built-in plugins (plugins/builtin: the
    # DLLs and builtin.lock.psd1 with their SHA256). arm64 is cross-built on the x64 runner. Only jobs that
    # consume the plugin DLLs should say "needs: binaries"; self-test, Pester and dry-run stay independent
    # so a .NET failure never hides a PowerShell result.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build binaries
        shell: pwsh
        env:
          WINEASE_ARCH: ${{ matrix.arch }}
          # stamped into WinEase.exe; empty outside a release tag (the script then falls back to git describe)
          WINEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./tools/build-binaries.ps1 -Architecture $env:WINEASE_ARCH -Version $env:WINEASE_VERSION

      - name: dotnet test
        # ARM64 binaries cannot run on the x64 runner; the arm64 leg only has to compile.
        if: matrix.arch == 'x64'
        shell: pwsh
        run: dotnet test src/WinEase.sln -c Release -p:Platform=x64 --nologo
        # (the solution holds the plugin contract tests, the launcher tests and the tests of the built-in plugins)

      - name: Upload binaries (WinUI window + WinEase.exe + built-in plugins)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            gui/winui/bin
            WinEase.exe
            plugins/builtin
          if-no-files-found: error
          retention-days: 14

  release-package:
    name: Release package (dry run)
    # Builds the source ZIP and the full packages (win-x64, win-arm64) from this commit and the binaries job,
    # and runs verify-release-zip.py on them, so the release workflow is exercised on every change.
    # Nothing is published; release.yml builds the real assets the same way (.github/scripts/build-release-assets.sh).
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the binaries (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-x64
          path: ${{ runner.temp }}/binaries/x64

      - name: Fetch the binaries (arm64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-arm64
          path: ${{ runner.temp }}/binaries/arm64

      - name: Build and verify the assets
        env:
          BINARIES: ${{ runner.temp }}/binaries
          LISTS: ${{ runner.temp }}/lists
        run: bash .github/scripts/build-release-assets.sh "ci-$GITHUB_RUN_ID" "$(git rev-parse HEAD)" "$BINARIES" dist "$LISTS"

      - name: The verifier rejects damaged packages
        env:
          LISTS: ${{ runner.temp }}/lists
        run: python3 -I .github/scripts/test-verify-release-zip.py "dist/WinEase-ci-$GITHUB_RUN_ID-win-x64.zip" "$LISTS/x64.sha256" "$(git rev-parse HEAD)"

  rust:
    name: Rust engine (cargo build + test)
    # tools/winease-physical-debloat is Windows-only (windows crate). Before this job nothing
    # compiled it in CI, so a Dependabot Cargo update could not be verified.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        shell: pwsh
        working-directory: tools/winease-physical-debloat
        run: |
          cargo --version
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }

  plugins-dotnet:
    name: Plugin contract (dotnet build + xUnit)
    # src/WinEase.Plugins.Abstractions is the contract of the plugin host (lib/WinEasePlugins.ps1) and
    # src/WinEase.Plugins.Builtin.* are the official plugins; the Pester suite compiles the same sources
    # with the Windows PowerShell compiler (C# 5), which is what a source checkout without the SDK does.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        shell: pwsh
        working-directory: src
        run: |
          dotnet --version
          dotnet build WinEase.Plugins.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }
          dotnet test WinEase.Plugins.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed with exit code $LASTEXITCODE" }
